<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ngọc Rồng Online - Chơi Trực Tiếp Trên Web (Toàn Màn Hình Ngang)</title>
  <meta name="description" content="Chơi game Java Ngọc Rồng Online (NRO) trực tiếp trên trình duyệt web, không cần cài đặt, hỗ trợ cảm ứng và phím ảo full màn hình ngang.">
  <meta name="theme-color" content="#060814">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NRO Web">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070913;
      --bg-panel: rgba(16, 20, 38, 0.92);
      --primary: #ff9e00;
      --primary-glow: rgba(255, 158, 0, 0.45);
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.4);
      --key-bg: #1a1e36;
      --key-border: #2a3158;
      --key-text: #f0f3ff;
      --key-active: #ff9e00;
      --key-active-text: #050711;
      --keypad-w: 200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Outfit', sans-serif;
      color: #fff;
    }

    /* Top Floating HUD */
    #top-hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: linear-gradient(180deg, rgba(7, 9, 19, 0.95) 0%, rgba(7, 9, 19, 0.5) 80%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      pointer-events: auto;
    }

    .brand-hud {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: #fff;
      text-shadow: 0 0 12px var(--primary-glow);
    }

    .brand-hud .badge {
      font-size: 0.65rem;
      background: linear-gradient(135deg, #ff9e00, #ff5500);
      color: #000;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      background: rgba(30, 36, 66, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .hud-btn:hover, .hud-btn:active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      box-shadow: 0 0 16px var(--primary-glow);
      transform: translateY(-1px);
    }

    /* Screen Area */
    #screen-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #11152c 0%, #060814 100%);
      z-index: 10;
    }

    #display {
      background-color: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.85), 0 0 1px 1px rgba(255, 158, 0, 0.3);
      border-radius: 4px;
      outline: none;
      max-width: 100vw;
      max-height: 100vh;
      cursor: crosshair;
    }

    /* Loading Screen */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }

    #loading[hidden], #loading.hidden {
      display: none !important;
    }

    .dragon-ball-spinner {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffdf70 0%, #ff9e00 60%, #c45b00 100%);
      box-shadow: 0 0 35px var(--primary-glow), inset 0 0 12px rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      animation: pulseBall 1.8s infinite ease-in-out;
      margin-bottom: 20px;
    }

    @keyframes pulseBall {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px var(--primary-glow); }
      50% { transform: scale(1.1); box-shadow: 0 0 45px rgba(255, 158, 0, 0.8); }
    }

    .loading-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      text-shadow: 0 0 16px var(--primary-glow);
    }

    .loading-status {
      font-size: 0.95rem;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.5;
    }

    .progress-pulse {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      margin-top: 16px;
      overflow: hidden;
      position: relative;
    }

    .progress-pulse::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      animation: slideProgress 1.4s infinite ease-in-out;
    }

    @keyframes slideProgress {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }

    /* Keypads */
    .keypad-part {
      background: rgba(10, 13, 26, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px;
      display: none;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      z-index: 50;
      transition: opacity 0.3s ease;
    }

    .key-grid {
      display: grid;
      gap: 8px;
      width: 100%;
      height: 100%;
    }

    .left-grid {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
    }

    .right-grid {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }

    .key {
      background: var(--key-bg);
      color: var(--key-text);
      border: 1px solid var(--key-border);
      border-radius: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.08s, transform 0.05s, box-shadow 0.08s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      line-height: 1.1;
    }

    .key span {
      font-size: 0.55rem;
      font-weight: 600;
      margin-top: 2px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .key:active, .key.active {
      background: var(--key-active) !important;
      color: var(--key-active-text) !important;
      box-shadow: 0 0 16px var(--primary-glow);
      transform: scale(0.92);
    }

    .key:active span, .key.active span {
      color: rgba(0, 0, 0, 0.7) !important;
    }

    .arrow-key {
      font-size: 1.6rem;
      color: var(--accent);
    }

    .ok-key {
      font-size: 1.1rem;
      background: linear-gradient(135deg, rgba(255, 158, 0, 0.25), rgba(255, 85, 0, 0.25));
      border-color: rgba(255, 158, 0, 0.6);
      color: #ffb732;
    }

    .action-key {
      font-size: 0.95rem;
      color: #38bdf8;
    }

    .small-key {
      width: 80%;
      height: 80%;
      font-size: 0.8rem;
      align-self: center;
      justify-self: center;
      padding: 2px;
    }

    /* Layout Positioning */
    #left-keys, #right-keys {
      display: none;
      position: absolute;
      bottom: 0;
    }

    #left-keys { left: 0; }
    #right-keys { right: 0; }

    body.kbd-landscape #left-keys,
    body.kbd-landscape #right-keys {
      display: flex;
      width: var(--keypad-w);
      height: 100%;
      top: 0;
      bottom: 0;
    }

    body.kbd-landscape #left-keys .key-grid,
    body.kbd-landscape #right-keys .key-grid {
      max-height: 380px;
      margin-top: 24px;
    }

    body.kbd-landscape #screen-area {
      left: var(--keypad-w);
      right: var(--keypad-w);
      top: 0;
      bottom: 0;
    }

    body.kbd-portrait #left-keys,
    body.kbd-portrait #right-keys {
      display: flex;
      width: 50%;
      height: 230px;
      bottom: 0;
    }

    body.kbd-portrait #screen-area {
      bottom: 230px;
      left: 0;
      right: 0;
      top: 44px;
    }

    /* Rotate Prompt */
    #rotate-hint {
      display: none;
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.8rem;
      color: #fbbf24;
      z-index: 120;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    @media (orientation: portrait) and (max-width: 600px) {
      #rotate-hint { display: block; }
    }
  </style>
</head>

<body>
  <!-- Top Navigation & Controls HUD -->
  <header id="top-hud">
    <div class="brand-hud">
      <span>🐉 NGỌC RỒNG ONLINE</span>
      <span class="badge">OFFLINE PWA</span>
    </div>

    <div class="hud-actions">
      <button id="btn-toggle-keypad" class="hud-btn" onclick="window.toggleKeypad()" title="Bật/Tắt Phím Ảo">
        <span>🎮</span> <span>Phím Ảo</span>
      </button>
      <button id="btn-fullscreen" class="hud-btn" onclick="window.toggleFullscreen()" title="Toàn Màn Hình Ngang">
        <span>⛶</span> <span>Toàn Màn Hình</span>
      </button>
    </div>
  </header>

  <!-- Rotate screen hint -->
  <div id="rotate-hint">🔄 Xoay ngang điện thoại để chơi tốt nhất</div>

  <!-- Central Display Canvas Container -->
  <main id="screen-area">
    <canvas tabindex="0" id="display" style="display: none;"></canvas>
    
    <div id="loading">
      <div class="dragon-ball-spinner">⭐</div>
      <h1 class="loading-title">NGỌC RỒNG ONLINE</h1>
      <p class="loading-status" id="loading-text">Đang tải CheerpJ & khởi động game...</p>
      <div class="progress-pulse"></div>
    </div>
  </main>

  <!-- Left Keypad (1-9, *, 0, #) -->
  <nav id="left-keys" class="keypad-part" aria-label="Bàn phím số bên trái">
    <div class="key-grid left-grid">
      <button data-key="Digit1" class="key">1</button>
      <button data-key="Digit2" class="key">2 <span>ABC</span></button>
      <button data-key="Digit3" class="key">3 <span>DEF</span></button>
      <button data-key="Digit4" class="key">4 <span>GHI</span></button>
      <button data-key="Digit5" class="key">5 <span>JKL</span></button>
      <button data-key="Digit6" class="key">6 <span>MNO</span></button>
      <button data-key="Digit7" class="key">7 <span>PQRS</span></button>
      <button data-key="Digit8" class="key">8 <span>TUV</span></button>
      <button data-key="Digit9" class="key">9 <span>WXYZ</span></button>
      <button data-key="NumpadAsterisk" class="key">*</button>
      <button data-key="Digit0" class="key">0 <span>+</span></button>
      <button data-key="NumpadDivide" class="key">#</button>
    </div>
  </nav>

  <!-- Right Keypad (Navigation & Actions) -->
  <nav id="right-keys" class="keypad-part" aria-label="Phím điều hướng bên phải">
    <div class="key-grid right-grid">
      <button data-key="F1" class="key action-key" title="Phím mềm trái (Menu / Q)">L</button>
      <button data-key="ArrowUp" class="key arrow-key" aria-label="Lên">▲</button>
      <button data-key="F2" class="key action-key" title="Phím mềm phải (Đóng / W)">R</button>
      <button data-key="ArrowLeft" class="key arrow-key" aria-label="Trái">◀</button>
      <button data-key="Enter" class="key ok-key" aria-label="Chọn / Bắn">OK</button>
      <button data-key="ArrowRight" class="key arrow-key" aria-label="Phải">▶</button>
      <button data-key="Escape" class="key small-key" title="Thoát / Esc">Esc</button>
      <button data-key="ArrowDown" class="key arrow-key" aria-label="Xuống">▼</button>
      <button data-key="Maximize" class="key small-key" onclick="window.toggleFullscreen()" title="Toàn màn hình">⛶</button>
    </div>
  </nav>

  <!-- Service Worker Registration for Offline PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('[SW] ServiceWorker registered with scope:', reg.scope);
        }).catch((err) => {
          console.warn('[SW] ServiceWorker registration failed:', err);
        });
      });
    }

    // Auto lock landscape on first touch/click
    document.addEventListener('pointerdown', function requestLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
      document.removeEventListener('pointerdown', requestLandscape);
    }, { once: true });
  </script>

  <!-- CheerpJ Engine & FreeJ2ME Launcher -->
  <script src="https://cjrtnc.leaningtech.com/20260317_2978/loader.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
